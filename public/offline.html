<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitPack — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0e1a;
      color: #e8e6f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 320px; }
    h1 { font-size: 2.5rem; margin-bottom: 12px; }
    .title { font-size: 1.5rem; font-weight: 900; color: #a78bfa; margin-bottom: 8px; }
    p { color: #5c5880; font-size: 0.9rem; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 24px;
      background: #7c6df0;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="font-size: 4rem; margin-bottom: 16px;">📱</div>
    <div class="title">You're offline</div>
    <p>HabitPack needs a connection to sync your habits. Check your internet and try again.</p>
    <a href="/dashboard" class="btn">Try again</a>
  </div>
</body>
</html>
